    <meta property="og:title" content="Feyron | AI Productivity &amp; Technology" />

    <script>
      (function () {
        try {
          var _origDefineProperty = Object.defineProperty;
          Object.defineProperty = function (obj, prop, desc) {
            if (obj === window && (prop === 'ethereum' || prop === 'solana')) {
              var existing = Object.getOwnPropertyDescriptor(window, prop);
              if (existing && !existing.configurable) {
                return obj;
              }
            }
            try {
              return _origDefineProperty.call(Object, obj, prop, desc);
            } catch (err) {
              if (obj === window && (prop === 'ethereum' || prop === 'solana')) {
                return obj;
              }
              throw err;
            }
          };
        } catch (e) {}
        try {
          history.scrollRestoration = 'manual';
          window.scrollTo(0, 0);
        } catch (e) {}
        try {
          if (location.pathname.replace(/\/+$/, '') === '/play') {
            window.__csGameOnly = true;
          }
        } catch (e) {}
        document.documentElement.classList.add('cs-guide-locked');
        setTimeout(function () {
          if (!document.querySelector('.cs-guide-gate')) {
            document.documentElement.classList.remove('cs-guide-locked');
          }
        }, 6500);
        try {
          var themeVersion = '2026-11-05.1';
          window.__CS_THEME_VERSION = themeVersion;
          if (localStorage.getItem('cs-theme-version') !== themeVersion) {
            localStorage.removeItem('cs-theme');
            localStorage.removeItem('cs-mascot-variant');
            localStorage.setItem('cs-theme-version', themeVersion);
          }
          var q = new URLSearchParams(location.search).get('theme');
          if (q === 'default' || q === 'yellow' || q === 'lime') {
            localStorage.removeItem('cs-theme');
            localStorage.setItem('cs-theme-version', themeVersion);
            q = '';
          } else if (q) {
            localStorage.setItem('cs-theme', q);
            localStorage.setItem('cs-theme-version', themeVersion);
          }
          var t = q || localStorage.getItem('cs-theme');
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
        window.__resources = {
          claudeLogo: '/site/assets/claude-logo.png',
          envelope: '/site/assets/envelope.png',
          pen: '/site/assets/pen.png',
          invoice: '/site/assets/invoice.png'
        };
      })();
    </script>
  </head>
  <body style="background:#1E1E1E">
    <style>
      #feyron-intro-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483650;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1E1E1E;
        overflow: hidden;
        transition: opacity 0.48s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.48s ease, background-color 0.22s ease;
      }
      #feyron-intro-splash.is-warm {
        background: var(--bg, #FEB47B);
      }
      #feyron-intro-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #feyron-intro-video {
        width: min(84vmin, 620px);
        height: min(84vmin, 620px);
        object-fit: contain;
        display: block;
        border: none;
        outline: none;
        box-shadow: none;
        background: transparent;
        pointer-events: none;
        transition: filter 0.3s ease;
      }
      .feyron-intro-controls {
        position: fixed;
        right: clamp(18px, 3vw, 36px);
        bottom: clamp(18px, 3vh, 32px);
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .feyron-intro-btn {
        cursor: pointer !important;
        border: 1.5px solid var(--bg, #FEB47B);
        background: rgba(30, 30, 30, 0.82);
        color: var(--bg, #FEB47B);
        font-family: ui-monospace, 'Geist Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 8px 16px;
        border-radius: 100px;
        transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      }
      #feyron-intro-splash.is-warm .feyron-intro-btn {
        background: #1E1E1E;
        color: var(--bg, #FEB47B);
        border-color: #1E1E1E;
      }
      .feyron-intro-btn:hover {
        background: var(--bg, #FEB47B);
        color: #1E1E1E;
      }
    </style>

    <div id="feyron-intro-splash" role="dialog" aria-label="Feyron intro animation">
      <video
        id="feyron-intro-video"
        muted
        autoplay
        playsinline
        preload="auto"
        data-source-asset="/assets/aistudio/Feyron_Logo_Animation_TB__0bb1b9b2.mp4"
      >
        <source src="/site/assets/brand/feyron_logo_animation.webm" type="video/webm" />
        <source src="/site/assets/brand/feyron_logo_animation.mp4" type="video/mp4" />
        <source src="/assets/aistudio/Feyron_Logo_Animation_TB__0bb1b9b2.mp4" type="video/mp4" />
      </video>
      <div class="feyron-intro-controls">
        <button type="button" class="feyron-intro-btn" id="feyron-intro-sound" style="display:none">
          Sound
        </button>
        <button type="button" class="feyron-intro-btn" id="feyron-intro-skip">
          Skip →
        </button>
      </div>
    </div>

    <script>
      (function () {
        var splash = document.getElementById('feyron-intro-splash');
        var video = document.getElementById('feyron-intro-video');
        var skipBtn = document.getElementById('feyron-intro-skip');
        var soundBtn = document.getElementById('feyron-intro-sound');
        var closed = false;

        var HUE_MAP = {
          melocoton: 0,
          menta: 116,
          rosa: 244,
          electrico: 209,
          cielo: 175,
          coral: -19,
          hielo: 180
        };
        var VARIANT_THEME = {
          pixel: 'melocoton',
          denso: 'menta',
          nube: 'rosa',
          erizo: 'electrico',
          orb: 'cielo',
          gota: 'coral',
          anillo: 'hielo',
          estrella: 'melocoton'
        };

        function applyAgentColor() {
          var dt = document.documentElement.getAttribute('data-theme') || localStorage.getItem('cs-theme');
          if (!dt) {
            var mv = localStorage.getItem('cs-mascot-variant');
            if (mv && VARIANT_THEME[mv]) dt = VARIANT_THEME[mv];
          }
          if (dt && HUE_MAP[dt] !== undefined && HUE_MAP[dt] !== 0) {
            if (video) video.style.filter = 'hue-rotate(' + HUE_MAP[dt] + 'deg)';
          }
        }

        window.__feyronIntroActive = true;

        function closeIntro() {
          if (closed) return;
          closed = true;
          window.__feyronIntroActive = false;
          if (video) {
            try { video.pause(); } catch (e) {}
          }
          document.body.style.background = '';
          if (!splash) return;
          splash.classList.add('is-leaving');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 480);
        }

        function syncStageBg() {
          if (closed || !video || !splash) return;
          if (video.currentTime >= 2.98) {
            splash.classList.add('is-warm');
          } else {
            splash.classList.remove('is-warm');
          }
        }

        function enableGestureUnmute() {
          if (soundBtn) soundBtn.style.display = 'inline-flex';
          var unmuteOnGesture = function () {
            if (!closed && video) {
              video.muted = false;
              video.volume = 1.0;
              var p = video.play();
              if (p && typeof p.catch === 'function') p.catch(function () {});
              if (soundBtn) soundBtn.style.display = 'none';
            }
            window.removeEventListener('pointerdown', unmuteOnGesture);
            window.removeEventListener('touchstart', unmuteOnGesture);
            window.removeEventListener('keydown', unmuteOnGesture);
          };
          window.addEventListener('pointerdown', unmuteOnGesture, { passive: true });
          window.addEventListener('touchstart', unmuteOnGesture, { passive: true });
          window.addEventListener('keydown', unmuteOnGesture, { passive: true });
        }

        function tryPlayWithSound() {
          if (!video) return;
          applyAgentColor();
          // Start visual playback first, then immediately attempt unmuted audio
          video.muted = false;
          video.volume = 1.0;
          var p = video.play();
          if (p && typeof p.then === 'function') {
            p.then(function () {
              if (soundBtn) soundBtn.style.display = 'none';
            }).catch(function () {
              // Cold domain (e.g. fresh Vercel URL) blocked unmuted autoplay: play muted so visuals always show
              video.muted = true;
              var p2 = video.play();
              if (p2 && typeof p2.catch === 'function') p2.catch(function () {});
              enableGestureUnmute();
            });
          }
          // Safeguard: if browser auto-pauses when unmuted without user gesture, resume muted immediately
          video.addEventListener('pause', function () {
            if (!closed && !video.ended && video.currentTime < 5.8) {
              video.muted = true;
              var pr = video.play();
              if (pr && typeof pr.catch === 'function') pr.catch(function () {});
              enableGestureUnmute();
            }
          });
        }

        var cleanPath = (location.pathname || '/').replace(/\/+$/, '') || '/';
        if (cleanPath !== '/') {
          window.__feyronIntroActive = false;
          document.body.style.background = '';
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          closed = true;
        } else {
          if (video) {
            tryPlayWithSound();
            var tick = function () {
              if (closed) return;
              syncStageBg();
              requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
            video.addEventListener('timeupdate', syncStageBg);
            video.addEventListener('ended', closeIntro);
          }
          if (splash) {
            splash.addEventListener('click', function (e) {
              if (e.target === skipBtn || e.target === soundBtn) return;
              if (video && video.muted) {
                video.muted = false;
                video.volume = 1.0;
                video.play().catch(function () {});
                if (soundBtn) soundBtn.style.display = 'none';
              }
            });
          }
          if (soundBtn) {
            soundBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                video.play().catch(function () {});
              }
              soundBtn.style.display = 'none';
            });
          }
          if (skipBtn) {
            skipBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              closeIntro();
            });
          }
          window.addEventListener('keydown', function (e) {
            if (!closed && (e.key === 'Escape' || e.key === 'Enter')) {
              closeIntro();
            }
          });
          setTimeout(closeIntro, 6500);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
