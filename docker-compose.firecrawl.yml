# Firecrawl Open-Source Self-Hosted Docker Compose
# Repository: https://github.com/firecrawl/firecrawl
# To start: docker compose -f docker-compose.firecrawl.yml up -d
# API will be available at: http://localhost:3002

services:
  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl-api
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright:3000/scrape
      - USE_DB_AUTHENTICATION=false
      - NUM_WORKERS_PER_QUEUE=4
    depends_on:
      - redis
      - playwright

  playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: firecrawl-playwright
    restart: unless-stopped
    environment:
      - PORT=3000
    expose:
      - "3000"

  redis:
    image: redis:alpine
    container_name: firecrawl-redis
    restart: unless-stopped
    expose:
      - "6379"
